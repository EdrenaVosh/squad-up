version: 2

project_name: squad-up

before:
  hooks:
    - go mod tidy

# Two names for one program: `squad` is the command, `squad-up` is the same thing
# under the name of the project, for a shell where `squad` is taken.
builds:
  - id: squad
    main: ./cmd/squad
    binary: squad
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags: &ldflags
      - -s -w
      - -X github.com/EdrenaVosh/squad-up/internal/version.Version={{ .Version }}
      - -X github.com/EdrenaVosh/squad-up/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/EdrenaVosh/squad-up/internal/version.Date={{ .Date }}
  - id: squad-up
    main: ./cmd/squad
    binary: squad-up
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags: *ldflags

archives:
  - id: squad-up
    ids: [squad, squad-up]
    formats: [tar.gz]
    name_template: "squad-up_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

# Set explicitly so GoReleaser does not need a git remote (none exists until
# the publish stage).
release:
  github:
    owner: EdrenaVosh
    name: squad-up

# `brew install EdrenaVosh/tap/squad-up`. GoReleaser's own advice for a
# precompiled binary is a cask (`brews` is deprecated). The cask is pushed to the
# homebrew-tap repository by the release workflow; a snapshot build only writes
# it into dist/.
homebrew_casks:
  - name: squad-up
    ids: [squad-up]
    binaries: [squad, squad-up]
    repository:
      owner: EdrenaVosh
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/EdrenaVosh/squad-up
    description: Switch Claude Code agent teams with one command
    license: MIT

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
