<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 880" width="1480" height="880" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1e1e1e"/></marker>
<marker id="r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#e03131"/></marker></defs>
<rect width="1480" height="880" fill="#ffffff"/>
<rect x="40" y="150" width="150" height="70" rx="12" fill="#e7f5ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="115.0" y="190.0" font-size="17" text-anchor="middle" fill="#1e1e1e">You</text>
<rect x="270" y="130" width="240" height="110" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="390.0" y="179.0" font-size="17" text-anchor="middle" fill="#1e1e1e" font-weight="bold">squad</text>
<text x="390.0" y="201.0" font-size="14" text-anchor="middle" fill="#1e1e1e">terminal interface + CLI</text>
<rect x="610" y="115" width="340" height="140" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<text x="780.0" y="157.0" font-size="17" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Preset library</text>
<text x="780.0" y="179.0" font-size="14" text-anchor="middle" fill="#1e1e1e">~/.squadup/presets/&lt;name&gt;/</text>
<text x="780.0" y="201.0" font-size="14" text-anchor="middle" fill="#1e1e1e">preset.yaml + agents/*.md</text>
<text x="780.0" y="223.0" font-size="14" text-anchor="middle" fill="#1e1e1e">Initial = your original setup, never changed</text>
<rect x="1060" y="130" width="330" height="110" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<text x="1225.0" y="168.0" font-size="17" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Compile (in memory)</text>
<text x="1225.0" y="190.0" font-size="14" text-anchor="middle" fill="#1e1e1e">adds the independence charter and</text>
<text x="1225.0" y="212.0" font-size="14" text-anchor="middle" fill="#1e1e1e">the flow brief for the main agent</text>
<rect x="640" y="340" width="330" height="125" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="805.0" y="374.5" font-size="17" text-anchor="middle" fill="#1e1e1e" font-weight="bold">squad use  (equip)</text>
<text x="805.0" y="396.5" font-size="14" text-anchor="middle" fill="#1e1e1e">writes ~/.claude/agents + settings</text>
<text x="805.0" y="418.5" font-size="14" text-anchor="middle" fill="#1e1e1e">backup · manifest · drift check</text>
<text x="805.0" y="440.5" font-size="14" text-anchor="middle" fill="#1e1e1e">squad restore / undo bring it all back</text>
<rect x="1060" y="340" width="330" height="125" rx="12" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<text x="1225.0" y="374.5" font-size="17" text-anchor="middle" fill="#1e1e1e" font-weight="bold">squad run  (one session)</text>
<text x="1225.0" y="396.5" font-size="14" text-anchor="middle" fill="#1e1e1e">claude --agents --settings</text>
<text x="1225.0" y="418.5" font-size="14" text-anchor="middle" fill="#1e1e1e">--append-system-prompt</text>
<text x="1225.0" y="440.5" font-size="14" text-anchor="middle" fill="#1e1e1e">nothing is written to ~/.claude</text>
<rect x="500" y="520" width="900" height="330" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="2" stroke-dasharray="8 6"/>
<text x="516" y="548" font-size="18" font-weight="bold" fill="#495057">Claude Code session</text>
<rect x="545" y="620" width="210" height="100" rx="12" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="650.0" y="653.0" font-size="17" text-anchor="middle" fill="#1e1e1e" font-weight="bold">Main agent</text>
<text x="650.0" y="675.0" font-size="14" text-anchor="middle" fill="#1e1e1e">the session itself</text>
<text x="650.0" y="697.0" font-size="14" text-anchor="middle" fill="#1e1e1e">flow + review loop</text>
<rect x="850" y="560" width="190" height="64" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="945.0" y="597.0" font-size="17" text-anchor="middle" fill="#1e1e1e">planner</text>
<rect x="850" y="750" width="190" height="64" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="945.0" y="787.0" font-size="17" text-anchor="middle" fill="#1e1e1e">builder</text>
<rect x="1130" y="610" width="220" height="90" rx="12" fill="#ffe066" stroke="#1e1e1e" stroke-width="2"/>
<text x="1240.0" y="649.0" font-size="17" text-anchor="middle" fill="#1e1e1e" font-weight="bold">reviewer</text>
<text x="1240.0" y="671.0" font-size="14" text-anchor="middle" fill="#1e1e1e">◈ independent</text>
<rect x="40" y="590" width="380" height="160" rx="12" fill="#99e9f2" stroke="#1e1e1e" stroke-width="2"/>
<text x="230.0" y="631.0" font-size="17" text-anchor="middle" fill="#1e1e1e" font-weight="bold">squad usage  ·  TOKENS · LIVE</text>
<text x="230.0" y="653.0" font-size="14" text-anchor="middle" fill="#1e1e1e">reads the session&#x27;s own transcripts</text>
<text x="230.0" y="675.0" font-size="14" text-anchor="middle" fill="#1e1e1e">~/.claude/projects/…/*.jsonl</text>
<text x="230.0" y="697.0" font-size="14" text-anchor="middle" fill="#1e1e1e">+ subagents/agent-*.jsonl</text>
<text x="230.0" y="719.0" font-size="14" text-anchor="middle" fill="#1e1e1e">tokens per agent and for the whole squad</text>
<line x1="190" y1="185" x2="270" y2="185" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="510" y1="185" x2="610" y2="185" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="950" y1="185" x2="1060" y2="185" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1225" y1="240" x2="1225" y2="340" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1150" y1="240" x2="805" y2="340" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="755" y1="650" x2="850" y2="595" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="755" y1="700" x2="850" y2="780" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="755" y1="660" x2="1130" y2="660" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1130" y1="692" x2="755" y2="692" stroke="#e03131" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#r)"/>
<line x1="805" y1="465" x2="805" y2="520" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1225" y1="465" x2="1225" y2="520" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="500" y1="700" x2="420" y2="680" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#a)"/>
<text x="40" y="58" font-size="34" fill="#1e1e1e" font-weight="bold">squadup — how it works</text>
<text x="40" y="90" font-size="16" fill="#495057">You design teams of Claude Code agents once. Claude Code runs them. squadup is the control room around it.</text>
<text x="194" y="164" font-size="14" fill="#495057">design,</text>
<text x="194" y="182" font-size="14" fill="#495057">switch</text>
<text x="512" y="144" font-size="14" fill="#495057">create · edit</text>
<text x="512" y="162" font-size="14" fill="#495057">import · export</text>
<text x="870" y="276" font-size="14" fill="#495057">two ways to use a preset</text>
<text x="790" y="722" font-size="14" fill="#e03131">defects go back to the builder, then the reviewer runs again (up to N rounds)</text>
<text x="1236" y="494" font-size="14" fill="#495057">agents loaded,</text>
<text x="1236" y="512" font-size="14" fill="#495057">settings applied</text>
<text x="425" y="722" font-size="14" fill="#495057">transcripts</text>
</svg>